<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 저장된 화면 테마를 첫 화면 그리기 전에 적용한다(다크 저장 상태에서 라이트가 먼저 보이는 깜빡임 방지). src/lib/theme.ts와 같은 규칙.
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('mealnote:theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.style.colorScheme = t;
        r.style.background = t === 'dark' ? '#181613' : '#F7F6F3';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#181613' : '#F7F6F3');
      })();
    </script>
    <meta name="description" content="트레이너와 함께 식단·운동을 기록하고 관리하는 앱" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FITORY" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>FITORY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
